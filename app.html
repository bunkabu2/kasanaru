<title>カサナル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow phone-first column; a single card sits center stage, two riso-ink circles overlap behind whatever "matched". */
:root{
  --paper:#EEF0F5; --card:#FFFFFF; --ink:#1B1F33; --muted:#5F667E; --line:#D5D9E4;
  --pink:#FF3D9A; --blue:#1F6FEB; --both:#6A2BB8; --ok:#0E8A5F; --warn:#B4541A;
  --blend:multiply; --shadow:0 1px 0 rgba(27,31,51,.06),0 10px 30px -12px rgba(27,31,51,.25);
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11131B; --card:#1B1E2B; --ink:#ECEEF6; --muted:#9BA2B9; --line:#2C3042;
  --pink:#FF5AAE; --blue:#4C8DFF; --both:#B98CFF; --ok:#3CC99A; --warn:#F09A5E;
  --blend:screen; --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11131B; --card:#1B1E2B; --ink:#ECEEF6; --muted:#9BA2B9; --line:#2C3042;
  --pink:#FF5AAE; --blue:#4C8DFF; --both:#B98CFF; --ok:#3CC99A; --warn:#F09A5E;
  --blend:screen; --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.7); color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-tap-highlight-color:transparent}
#app{max-width:460px;margin:0 auto;padding:20px 16px 40px;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:20px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
p{margin:0}
.display{font-family:var(--f-display);letter-spacing:.02em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.link{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:700;font-size:14px}
.link:hover{color:var(--ink)}

/* logo */
.logo{display:flex;align-items:center;gap:14px}
.dots{position:relative;width:46px;height:30px;flex:none}
.dots i{position:absolute;top:0;width:30px;height:30px;border-radius:50%;mix-blend-mode:var(--blend)}
.dots i:first-child{left:0;background:var(--pink)}
.dots i:last-child{left:16px;background:var(--blue)}
.logo h1{font-family:var(--f-display);font-size:30px;line-height:1}

.hero{display:flex;flex-direction:column;gap:14px;padding-block:18px 4px}
.hero .catch{font-family:var(--f-display);font-size:26px;line-height:1.45}
.hero .catch em{font-style:normal;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--pink) 35%,transparent) 62%)}

/* mode list */
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);transition:transform .15s}
.mode:hover{transform:translateY(-2px)}
.mode .mk{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:17px;color:#fff}
.mode .t{font-weight:700;font-size:17px;line-height:1.3}
.mode .s{font-size:13px;color:var(--muted);line-height:1.5}
.mode .n{font-size:12px;color:var(--muted)}
.mk.asobi{background:var(--pink)} .mk.gohan{background:var(--warn)} .mk.futari{background:var(--blue)} .mk.honne{background:var(--both)}

.foot{display:flex;gap:10px;flex-wrap:wrap}
.chipbtn{flex:1 1 140px;background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:10px 14px;font-weight:700;display:flex;justify-content:center;align-items:center;gap:8px}
.chipbtn:hover{border-color:var(--ink)}
.count{font-family:var(--f-mono);font-size:12px;background:var(--ink);color:var(--paper);border-radius:999px;padding:0 8px}

/* forms */
.sec{display:flex;flex-direction:column;gap:10px}
.players{display:grid;gap:8px}
.prow{display:flex;gap:8px;align-items:center}
.prow .no{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;background:var(--line);flex:none}
.prow input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.prow input:focus{border-color:var(--blue);outline:none}
.x{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:20px;flex:none}
.x:hover{background:var(--line);color:var(--ink)}
.add{align-self:flex-start;background:none;border:1.5px dashed var(--line);border-radius:10px;padding:8px 14px;font-weight:700;color:var(--muted)}
.add:hover{color:var(--ink);border-color:var(--ink)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:700;font-size:14px;color:var(--muted);line-height:1.3}
.seg button small{display:block;font-weight:400;font-size:11px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
textarea{width:100%;box-sizing:border-box;min-height:96px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
details summary{cursor:pointer;font-weight:700}
details[open] summary{margin-bottom:8px}

.primary{border:0;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:700;font-size:17px;padding:15px 20px;width:100%;box-shadow:var(--shadow)}
.primary:hover{filter:brightness(1.15)}
.ghost{border:1.5px solid var(--line);border-radius:999px;background:transparent;font-weight:700;padding:12px 18px;width:100%}
.ghost:hover{border-color:var(--ink)}
.row2{display:flex;gap:10px}
.row2>*{flex:1}

/* handoff */
.hand{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;padding-block:30px}
.hand .who{font-family:var(--f-display);font-size:38px;line-height:1.3;word-break:break-all}
.hand .big-dots{position:relative;width:120px;height:80px}
.hand .big-dots i{position:absolute;top:0;width:80px;height:80px;border-radius:50%;mix-blend-mode:var(--blend);animation:breathe 2.4s ease-in-out infinite}
.hand .big-dots i:first-child{left:0;background:var(--pink)}
.hand .big-dots i:last-child{left:40px;background:var(--blue);animation-delay:-1.2s}
@keyframes breathe{50%{transform:translateX(var(--d,6px))}}
.hand .big-dots i:first-child{--d:-6px}

/* judge */
.who-chip{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.who-chip i{width:10px;height:10px;border-radius:50%;background:var(--pink)}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--ink);transition:width .25s}
.stage{position:relative;flex:1;min-height:340px;display:grid;place-items:center;touch-action:none}
.card{position:relative;width:100%;max-width:340px;aspect-ratio:3/4;max-height:420px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;padding:22px;box-sizing:border-box;user-select:none;-webkit-user-select:none;transition:transform .2s ease,opacity .2s ease;overflow:hidden}
.card.drag{transition:none}
.card .deck{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.card .txt{font-family:var(--f-display);font-size:clamp(22px,6.6vw,28px);line-height:1.55;text-wrap:balance;word-break:auto-phrase}
.card .tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--muted)}
.tag.mine{border-color:var(--pink);color:var(--pink)}
.stamp{position:absolute;top:22px;padding:4px 12px;border:3px solid;border-radius:10px;font-family:var(--f-display);font-size:20px;opacity:0;transform:rotate(-8deg);pointer-events:none}
.stamp.y{right:18px;color:var(--ok)} .stamp.n{left:18px;color:var(--muted);transform:rotate(8deg)} .stamp.m{left:50%;top:auto;bottom:70px;transform:translateX(-50%);color:var(--blue)}
.card.fly-r{transform:translateX(130%) rotate(16deg);opacity:0}
.card.fly-l{transform:translateX(-130%) rotate(-16deg);opacity:0}
.card.fly-u{transform:translateY(-120%);opacity:0}
.votes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.vbtn{border-radius:18px;border:1.5px solid var(--line);background:var(--card);padding:12px 4px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.3}
.vbtn small{font-weight:400;font-size:11px;color:var(--muted)}
.vbtn .ic{font-family:var(--f-display);font-size:22px}
.vbtn.no .ic{color:var(--muted)} .vbtn.maybe .ic{color:var(--blue)} .vbtn.yes .ic{color:var(--ok)}
.vbtn:hover{border-color:var(--ink)}
.vbtn.yes{border-color:var(--ok)}
.underline{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* reveal */
.reveal{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:26px;min-height:60vh}
.merge{position:relative;width:200px;height:120px}
.merge i{position:absolute;top:10px;left:50%;width:100px;height:100px;margin-left:-50px;border-radius:50%;mix-blend-mode:var(--blend);animation:merge 1.5s cubic-bezier(.5,0,.2,1) forwards}
.merge i:nth-child(1){background:var(--pink);--from:-120px}
.merge i:nth-child(2){background:var(--blue);--from:120px}
.merge i:nth-child(3){background:var(--warn);--from:0;--fy:-80px;opacity:.85}
@keyframes merge{from{transform:translate(var(--from),var(--fy,0)) scale(.6)}to{transform:translate(0,0) scale(1)}}
.seeno{font-family:var(--f-display);font-size:34px}

/* result */
.hit{position:relative;padding-block:26px 6px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.hit .orbs{position:absolute;inset:0;display:flex;justify-content:center;pointer-events:none}
.hit .orbs i{position:absolute;top:0;width:190px;height:190px;border-radius:50%;mix-blend-mode:var(--blend);opacity:.22}
.hit .orbs i:first-child{transform:translateX(-55px);background:var(--pink)}
.hit .orbs i:last-child{transform:translateX(55px);background:var(--blue)}
.hit .kicker{position:relative;font-family:var(--f-display);font-size:16px;color:var(--both)}
.hit .card{position:relative;aspect-ratio:auto;min-height:220px;text-align:left}
.hit .card .txt{font-size:clamp(24px,7vw,30px)}
.meter{display:flex;gap:4px;align-items:center}
.meter span{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line)}
.meter span.y{background:var(--ok);border-color:var(--ok)}
.meter span.m{background:color-mix(in srgb,var(--blue) 45%,transparent);border-color:var(--blue)}
.meter span.n{background:transparent;border-style:dashed}
.note{font-size:13px;color:var(--muted);text-align:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat .v{font-family:var(--f-mono);font-size:26px;line-height:1.2}
.stat .k{font-size:12px;color:var(--muted)}
.stat .d{font-size:13px;line-height:1.5;margin-top:4px;overflow-wrap:anywhere}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.li .t{min-width:0;overflow-wrap:anywhere;line-height:1.5}
.li button.pick{border:0;background:none;color:var(--blue);font-weight:700;font-size:13px;padding:4px 0}
.empty{text-align:center;padding:30px 10px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

/* notebook */
.entry{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.entry .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.entry .c{font-family:var(--f-display);font-size:19px;line-height:1.5;overflow-wrap:anywhere}
.entry .m{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.entry .memo{font-size:14px;border-left:3px solid var(--line);padding-left:10px;overflow-wrap:anywhere;white-space:pre-wrap}
.entry .acts{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.pill.done{background:var(--ok);border-color:var(--ok);color:var(--card)}
.pill.danger{color:var(--warn)}
.pill.danger.arm{background:var(--warn);border-color:var(--warn);color:var(--card)}

.steps{display:flex;flex-direction:column;gap:14px;counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;counter-increment:s}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px}
.steps b{display:block}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:9;transition:opacity .2s}
.screen-in{animation:in .25s ease}
@keyframes in{from{opacity:.0;transform:translateY(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<div class="toast" id="toast" hidden></div>

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const players = () => S.names.map((n,i) => n.trim() || `プレイヤー${i+1}`);
const words = () => MODES[S.mode].talk ? V.talk : V.play;
const today = () => { const d = new Date(); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; };

function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 1800);
}
function go(screen){ S.screen = screen; render(); window.scrollTo(0,0); }

/* ───────── カードを配る ───────── */
function deal(){
  const m = MODES[S.mode];
  const custom = S.custom.split('\n').map(t => t.trim()).filter(Boolean).slice(0, S.per).map(t => ({t, w:0, mine:true}));
  let pool = POOL[S.mode].filter(c => m.talk || c.w <= S.when);
  const used = S.used[S.mode] || [];
  let fresh = pool.filter(c => !used.includes(c.t));
  if (fresh.length < S.per - custom.length) { fresh = pool; S.used[S.mode] = []; }
  const picked = shuffle(fresh.slice()).slice(0, Math.max(0, S.per - custom.length));
  S.used[S.mode] = (S.used[S.mode] || []).concat(picked.map(c => c.t));
  S.cards = shuffle(custom.concat(picked));
  S.votes = players().map(() => []);
  S.rnd = S.cards.map(() => Math.random());
  S.p = 0; S.i = 0; S.tie = 0;
}

/* ───────── 集計 ───────── */
function tally(){
  const n = players().length;
  const rows = S.cards.map((c, i) => {
    const vs = S.votes.map(v => v[i]);
    const yes = vs.filter(v => v === 2).length, maybe = vs.filter(v => v === 1).length, no = vs.filter(v => v === 0).length;
    const score = yes*2 + maybe;
    const mean = score / n, spread = vs.reduce((a,v) => a + (v-mean)**2, 0);
    return {c, i, yes, maybe, no, score, spread, r:(S.rnd || [])[i] || 0};
  });
  const byScore = (a,b) => b.score - a.score || b.yes - a.yes || a.r - b.r;
  const hits = rows.filter(r => r.no === 0).sort(byScore);
  const near = rows.filter(r => r.no === 1).sort(byScore).slice(0,3);
  const total = rows.reduce((a,r) => a + r.score, 0);
  const vibe = Math.round(total / (rows.length * n * 2) * 100);
  const split = rows.slice().sort((a,b) => b.spread - a.spread)[0];
  const tops = hits.filter(h => h.score === (hits[0] && hits[0].score) && h.yes === hits[0].yes);
  return {n, rows, hits, near, vibe, split, tops};
}

/* ───────── 描画とイベント ───────── */
function render(){
  if (S.screen === 'judge' && !S.cards[S.i]) S.screen = 'home';
  if ((S.screen === 'result' || S.screen === 'reveal') && !S.cards.length) S.screen = 'home';
  if (S.screen === 'keep' && !S.last) S.screen = 'home';
  app.innerHTML = SCREENS[S.screen]();
  app.classList.remove('screen-in'); void app.offsetWidth; app.classList.add('screen-in');
  if (S.screen === 'judge') bindSwipe();
  if (S.screen === 'reveal') setTimeout(() => { if (S.screen === 'reveal') go('result'); }, reduce ? 300 : 1700);
}

function syncNames(){
  app.querySelectorAll('[data-name]').forEach(el => S.names[+el.dataset.name] = el.value);
  const c = document.getElementById('custom'); if (c) S.custom = c.value;
}

app.addEventListener('input', e => {
  if (e.target.dataset.name !== undefined) S.names[+e.target.dataset.name] = e.target.value;
  if (e.target.id === 'custom') S.custom = e.target.value;
});

app.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.go) return go(d.go);
  if (d.mode) {
    S.mode = d.mode; const m = MODES[d.mode];
    const saved = store.get(NAMES, []);
    const n = m.max || Math.max(m.def, Math.min(saved.length, 10));
    S.names = Array.from({length:n}, (_,i) => saved[i] || '');
    return go('setup');
  }
  if (d.add !== undefined) { syncNames(); S.names.push(''); render(); const ins = app.querySelectorAll('[data-name]'); ins[ins.length-1].focus(); return; }
  if (d.del !== undefined) { syncNames(); S.names.splice(+d.del, 1); return render(); }
  if (d.when !== undefined) { syncNames(); S.when = +d.when; return render(); }
  if (d.per) { syncNames(); S.per = +d.per; return render(); }
  if (d.start !== undefined) {
    syncNames();
    const keepNames = store.get(NAMES, []);
    S.names.forEach((n,i) => { if (n.trim()) keepNames[i] = n.trim(); });
    store.set(NAMES, keepNames.slice(0,10));
    deal(); return go('hand');
  }
  if (d.quit !== undefined) return go('home');
  if (d.begin !== undefined) { S.i = 0; return go('judge'); }
  if (d.v) return vote(+d.v);
  if (d.undo !== undefined) { if (S.i > 0) { S.i--; S.votes[S.p].length = S.i; render(); } return; }
  if (d.tie !== undefined) { S.tie++; return render(); }
  if (d.pick) {
    const r = tally().rows[+d.pick];
    S.last = {card:r.c.t, mode:S.mode, players:players(), yes:r.yes, maybe:r.maybe, n:players().length};
    return go('keep');
  }
  if (d.keep !== undefined) return go('keep');
  if (d.again !== undefined) { deal(); return go('hand'); }
  if (d.copy !== undefined) return copyResult();
  if (d.save !== undefined) {
    const memo = (document.getElementById('memo') || {}).value || '';
    const notes = store.get(NOTES, []);
    notes.unshift({id:Date.now().toString(36), date:today(), mode:S.last.mode, card:S.last.card, players:S.last.players, memo:memo.trim(), done:false});
    store.set(NOTES, notes);
    toast('ノートに残しました');
    return go('notes');
  }
  if (d.done) {
    const notes = store.get(NOTES, []); const n = notes.find(x => x.id === d.done);
    if (n) { n.done = !n.done; store.set(NOTES, notes); }
    return render();
  }
  if (d.rm) {
    if (!b.classList.contains('arm')) { b.classList.add('arm'); b.textContent = 'もう一度押すと消えます'; setTimeout(() => { if (b.isConnected) { b.classList.remove('arm'); b.textContent = 'けす'; } }, 2500); return; }
    store.set(NOTES, store.get(NOTES, []).filter(x => x.id !== d.rm));
    toast('消しました'); return render();
  }
});

function vote(v, dir){
  if (S.screen !== 'judge' || vote.busy) return;
  S.votes[S.p][S.i] = v;
  const card = document.getElementById('card');
  const next = () => {
    vote.busy = false;
    S.i++;
    if (S.i < S.cards.length) return render();
    S.p++; S.i = 0;
    if (S.p < players().length) return go('hand');
    go('reveal');
  };
  if (reduce || !card) return next();
  vote.busy = true;
  card.classList.remove('drag');
  card.style.transform = '';
  card.classList.add(dir || (v === 2 ? 'fly-r' : v === 0 ? 'fly-l' : 'fly-u'));
  setTimeout(next, 200);
}

function bindSwipe(){
  const card = document.getElementById('card'); if (!card) return;
  const st = {y:card.querySelector('.stamp.y'), n:card.querySelector('.stamp.n'), m:card.querySelector('.stamp.m')};
  let x0, y0, dx = 0, dy = 0, on = false;
  card.addEventListener('pointerdown', e => { on = true; x0 = e.clientX; y0 = e.clientY; dx = dy = 0; card.classList.add('drag'); card.setPointerCapture(e.pointerId); });
  card.addEventListener('pointermove', e => {
    if (!on) return;
    dx = e.clientX - x0; dy = e.clientY - y0;
    card.style.transform = `translate(${dx}px,${Math.min(dy, 40)}px) rotate(${dx/18}deg)`;
    st.y.style.opacity = Math.max(0, Math.min(1, dx/90));
    st.n.style.opacity = Math.max(0, Math.min(1, -dx/90));
    st.m.style.opacity = Math.abs(dx) < 50 ? Math.max(0, Math.min(1, -dy/90)) : 0;
  });
  const end = () => {
    if (!on) return; on = false;
    if (dx > 90) return vote(2, 'fly-r');
    if (dx < -90) return vote(0, 'fly-l');
    if (dy < -90 && Math.abs(dx) < 60) return vote(1, 'fly-u');
    card.classList.remove('drag'); card.style.transform = '';
    Object.values(st).forEach(s => s.style.opacity = 0);
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}

document.addEventListener('keydown', e => {
  if (S.screen !== 'judge' || e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight') vote(2);
  if (e.key === 'ArrowLeft') vote(0);
  if (e.key === 'ArrowUp') { e.preventDefault(); vote(1); }
});

function copyResult(){
  const T = tally(), w = words(), m = MODES[S.mode];
  const top = T.tops[S.tie % T.tops.length];
  const text = `【カサナル／${m.name}】${T.n}人で${S.cards.length}枚から選んだ結果\n${m.talk ? 'これから話すこと' : 'これから、やること'}：${top.c.t}\n（${w.yes}${top.yes}・${w.maybe}${top.maybe}／ノリ度${T.vibe}%）`;
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(e){}
    ta.remove(); toast(ok ? 'コピーしました' : 'コピーできませんでした');
  };
  try { navigator.clipboard.writeText(text).then(() => toast('コピーしました'), fallback); } catch(e) { fallback(); }
}

const start = () => render();
if (hot && hot.ready) hot.ready(start); else start();
})();
</script>
